name: Node.js build

on:
    workflow_dispatch:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [ubuntu-latest]
                node-version: [20.x, 22.x, 24.x]
                include:
                    - os: windows-latest
                      node-version: 24.x
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'npm'
            - run: npm ci
            - name: Audit runtime dependencies
              if: matrix.os == 'ubuntu-latest' && matrix.node-version == '24.x'
              run: npm audit --omit=dev --registry=https://registry.npmjs.org
            - run: npm run check:node-types
            - run: npm test
            - name: Build and verify plugin artifacts
              run: npm run build
            - run: npm run lint
